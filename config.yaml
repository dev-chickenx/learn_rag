# RAG Configuration

# OpenAI API設定
openai_api_key: ${OPENAI_API_KEY}  # 環境変数から読み込み

# モデル設定
completion_model: "gpt-3.5-turbo"  # コスト効率の良いモデルを使用
# completion_model: "gpt-4o-mini"  # 学習計画2-2用のモデル
embedding_model: "text-embedding-3-small"

# チャンク設定
chunk_size: 384  # トークン数（256-512の中間値）
chunk_overlap: 50  # オーバーラップするトークン数

# 検索設定
top_k: 3  # 取得する類似チャンクの数

# キャッシュ設定
use_cache: true
cache_dir: ".cache"

# ドキュメント設定
docs_dir: "docs"
